<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta http-equiv="X-UA-Compatible" content="ie=edge">
		%sveltekit.head%
		<style>
			*, *::before, *::after {
				box-sizing: border-box;
			}

			@font-face {
				font-family: "Jua";
				src: url("/fonts/Jua-Regular.ttf") format("truetype");
			}

			@font-face {
				font-family: "LEMONMILK";
				src: url("/fonts/LemonMilk.woff2") format("woff2");
			}

			html {
				margin: 0;
				padding: 0;
			}

			body {
				font-family: "Jua", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", "Liberation Sans", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
				font-size: 1rem;
				font-weight: 400;
				line-height: 1.5;
				color: #212529;
				-webkit-text-size-adjust: 100%;
				-webkit-tap-highlight-color: rgba(0, 0, 0, 0);
				overflow-x: hidden;
				background-color: #ffffff;
				color-scheme: dark;
				display: flex;
				flex-direction: column;
				margin: 0;
				padding: 0;
			}
		</style>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
